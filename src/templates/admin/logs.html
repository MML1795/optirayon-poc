{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-header">📋 Journal des accès</div>
  <div class="card-body" style="padding:0">
    <table>
      <thead><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détail</th><th>IP</th></tr></thead>
      <tbody>
      {% for l in logs.items %}
      <tr>
        <td style="font-size:12px;white-space:nowrap">{{ l.timestamp.strftime('%d/%m/%Y %H:%M:%S') }}</td>
        <td>{{ l.username or '—' }}</td>
        <td>{{ l.action }}</td>
        <td style="font-size:12px;color:#888">{{ l.detail or '—' }}</td>
        <td style="font-size:12px;color:#888">{{ l.ip_address or '—' }}</td>
      </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
