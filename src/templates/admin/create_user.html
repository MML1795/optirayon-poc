{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:500px">
  <div class="card-header">+ Créer un utilisateur</div>
  <div class="card-body">
    <form method="POST">
      <div class="form-group"><label>Identifiant</label><input type="text" name="username" required></div>
      <div class="form-group" style="margin-top:12px"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group" style="margin-top:12px"><label>Mot de passe</label><input type="password" name="password" required></div>
      <div class="form-group" style="margin-top:12px"><label>Rôle</label>
        <select name="role"><option value="viewer">Viewer</option><option value="rayon">Chef de rayon</option><option value="admin">Admin</option></select>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:20px">Créer</button>
      <a href="{{ url_for('admin.users') }}" class="btn btn-secondary" style="margin-left:8px">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
